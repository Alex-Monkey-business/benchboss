[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  # Playwright ligger som devDependency for QA-scriptene i scripts/. Uten
  # denne laster npm install ned ~300 MB nettlesere ved HVER deploy — for et
  # verktøy byggingen aldri bruker.
  PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD = "1"

[[headers]]
  for = "/*"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"

# Alt under /assets har innholdshash i navnet — en ny versjon er en ny fil.
# Ett døgn her betydde at appen lastet 130 KB JS på nytt hver dag. Ett år,
# immutable: nettleseren spør ikke engang. Samme for fontene.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/illustrations/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
