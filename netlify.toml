[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  # Playwright ligger som devDependency for QA-scriptene i scripts/. Uten
  # denne laster npm install ned ~300 MB nettlesere ved HVER deploy — for et
  # verktøy byggingen aldri bruker.
  PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD = "1"

[[headers]]
  for = "/*"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=86400"

[[headers]]
  for = "/illustrations/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
