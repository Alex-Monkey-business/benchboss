<!DOCTYPE html>
<html lang="no">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#2563EB" />
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/icons/favicon-16.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/icons/icon-180.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="BenchBoss" />
    <!-- Preload coach photos so login screen has them in cache immediately -->
    <link rel="preload" as="image" href="/coaches/iver.png" />
    <link rel="preload" as="image" href="/coaches/jacob.png" />
    <link rel="preload" as="image" href="/coaches/simon.png" />
    <link rel="preload" as="image" href="/coaches/trond.png" />
    <link rel="preload" as="image" href="/icons/splash/base.png" />
    <link rel="preload" as="image" href="/icons/splash/bench-frame.png" />
    <link rel="preload" as="image" href="/icons/splash/bb-letters.png" />
    <link rel="preload" as="image" href="/icons/splash/cones.png" />
    <link rel="preload" as="image" href="/icons/splash/ball.png" />
    <title>BenchBoss</title>
    <meta name="description" content="Built for the beautiful chaos of grassroots football" />
    <style>
      /* Launch splash — bridges the OS splash on standalone launch.
         Same icon + same #FAF9F7 as the native splash, so the two read as one.
         The icon is assembled layer by layer: frame drops, B's sit down,
         cone-crown rises, ball bounces in to rest. */
      #app-splash {
        position: fixed;
        inset: 0;
        z-index: 2147483647;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #FAF9F7;
        opacity: 1;
        transition: opacity 0.4s ease;
      }
      #app-splash.is-hiding {
        opacity: 0;
        pointer-events: none;
      }
      #app-splash .stage {
        position: relative;
        width: min(62vw, 248px);
        aspect-ratio: 1 / 1;
      }
      #app-splash .stage img {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        object-fit: contain;
        will-change: transform, opacity;
      }
      /* Stacking + per-layer entrance. Spring easing for the "settle" feel. */
      #app-splash .l-base    { animation: bs-base  0.30s cubic-bezier(0.22, 0.61, 0.36, 1) both; }
      #app-splash .l-frame   { animation: bs-drop  0.50s cubic-bezier(0.34, 1.56, 0.64, 1) 0.10s both; }
      #app-splash .l-letters { animation: bs-drop  0.52s cubic-bezier(0.34, 1.56, 0.64, 1) 0.28s both; }
      #app-splash .l-cones   { animation: bs-crown 0.54s cubic-bezier(0.34, 1.56, 0.64, 1) 0.46s both; }
      #app-splash .l-ball    { animation: bs-ball  0.56s cubic-bezier(0.34, 1.56, 0.64, 1) 0.60s both; }

      @keyframes bs-base {
        from { opacity: 0; transform: scale(0.92); }
        to   { opacity: 1; transform: scale(1); }
      }
      @keyframes bs-drop {
        0%   { opacity: 0; transform: translateY(-7%) scale(0.96); }
        55%  { opacity: 1; }
        100% { opacity: 1; transform: translateY(0) scale(1); }
      }
      @keyframes bs-crown {
        0%   { opacity: 0; transform: translateY(14%) scale(0.86); }
        60%  { opacity: 1; }
        100% { opacity: 1; transform: translateY(0) scale(1); }
      }
      @keyframes bs-ball {
        0%   { opacity: 0; transform: translateY(-26%) scale(0.6) rotate(-40deg); }
        70%  { opacity: 1; transform: translateY(1%) scale(1) rotate(6deg); }
        100% { opacity: 1; transform: translateY(0) scale(1) rotate(0); }
      }
      @media (prefers-reduced-motion: reduce) {
        #app-splash .stage img {
          animation: none !important;
          opacity: 1 !important;
          transform: none !important;
        }
      }
    </style>
  </head>
  <body>
    <div id="app-splash" aria-hidden="true">
      <div class="stage">
        <img class="l-base" src="/icons/splash/base.png" alt="" />
        <img class="l-frame" src="/icons/splash/bench-frame.png" alt="" />
        <img class="l-letters" src="/icons/splash/bb-letters.png" alt="" />
        <img class="l-cones" src="/icons/splash/cones.png" alt="" />
        <img class="l-ball" src="/icons/splash/ball.png" alt="" />
      </div>
    </div>
    <script>
      // Only bridge the launch splash when opened as an installed app —
      // in a normal browser tab we want straight-to-app, no splash.
      if (!(window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone)) {
        var s = document.getElementById('app-splash')
        if (s) s.remove()
      }
    </script>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
