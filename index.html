<!DOCTYPE html>
<html lang="nb">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#FFFFFF" />
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32.png?v=bb" />
    <link rel="icon" type="image/png" sizes="16x16" href="/icons/favicon-16.png?v=bb" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/icons/icon-180.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="BenchBoss" />
    <title>BenchBoss</title>
    <!-- Kald start: DNS + TLS mot basen og fontene starter før JS-en er lest. -->
    <link rel="preconnect" href="%VITE_SUPABASE_URL%" crossorigin />
    <!-- Bare Inter forhåndslastes: den er brødteksten i første bilde. Fraunces
         (66 KB) slåss ellers med JS-en om båndbredden ved kald start, og
         lastes av @font-face når en overskrift faktisk trenger den. -->
    <link rel="preload" href="/fonts/inter-latin.woff2" as="font" type="font/woff2" crossorigin />
    <meta name="description" content="Spilletid, tropper og trening for barnefotballen" />
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
